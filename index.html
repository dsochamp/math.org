<!DOCTYPE html>
<html>
    <head>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Walter+Turncoat&display=swap');

            body {
                background-color: #49516F;
                background-image: url('grid.png');
                overflow:scroll;
            }

            /* I have put the tag #bodymain so that my CSS formatting does not interfere with the generated simulation. */

            #bodymain {
                font-family: 'Elms Sans', cursive;
                font-weight: 600;
                color: whitesmoke;
                line-height: 40px;
            }

            #bodymain h1 {
                text-align:center;
                color: rgb(251, 251, 249);
                font-size: 70px;
                text-shadow: 5px 5px 20px #000000;
            }

            #bodymain button {
                background-color: rgba(0, 0, 0, 0);
                border-color: rgba(0, 0, 0, 0);
                border-radius: calc(16px * var(--brm));
                corner-shape: squircle;
            }

            #bodymain p {
                font-family: 'Elms Sans', monospace;
                color: rgb(254, 255, 255);
                text-align: center;
                
            }

            :root {
            --brm: 1;
            }

            @supports (corner-shape: squircle) {
            :root {
                --brm: 3;
            }
            }

            .glass-card {
                background-color: rgba(240, 248, 255, 0.63);
                /*border: 5px solid rgba(240, 248, 255, 0.5);*/
                -webkit-box-shadow: inset 2px 2px 0px -2px rgba(255, 255, 255, 0.7), inset 0 0 3px 1px rgba(255, 255, 255, 0.7);
                box-shadow: inset 2px 2px 0px -2px rgba(255, 255, 255, 0.7), inset 0 0 3px 1px rgba(255, 255, 255, 0.7);
                border-radius: calc(16px * var(--brm));
                corner-shape: squircle;
                padding: 25px;
                backdrop-filter: blur(2px);
                color:#49516F;
            }

            .modal-box {
                background: #111;
                padding: 15px;
                border-radius: 8px;
                text-align: right;
            }

            #bodymain input {
                background-color: beige;
                height: 30px;
                width: 500px;
                font-family: 'Elms Sans', monospace;
                border-radius: calc(16px * var(--brm));
                corner-shape: squircle;
            }

            #prompt {
                height: 35px;
            }
            
            #response {
                color: #49516F;
                min-height: 120px;
            }

            #response iframe {
                width: 100%;
                min-height: 700px;
                border: 0;
                border-radius: 16px;
                background: white;
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
            }
            
            #watermark {
                border-radius: calc(16px * var(--brm));
                corner-shape: squircle;   
                background-color: azure; 
                color: #49516F; 
                padding: 10px; 
                
                width: 300px; 
                text-align: center; 
                font-family:'Elms Sans', monospace; 
            }

        </style>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">    
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
            onload="if (window.renderMathInElement) renderMathInElement(document.getElementById('response'));"></script>
    </head>
    <body>
    <div id="bodymain">
        <h1>math.org</h1>
        <br> 

        <div class="glass-card" id="enterbox">
            <label for="prompt">What concept are you currently struggling with?: </label>
            <input id="prompt" type="text" placeholder=" i.e. Trigonometry on the Unit Circle"><h4></h4>
            <label for="source">What source would you like to give the AI for its research? (Type N/A if not available): </label>
            <input style="width: 450px !important;" id="source" type="url" placeholder="i.e. https://tutorial.math.lamar.edu/pdf/trig_cheat_sheet.pdf"><h4></h4>
            <label for="focus">What aspect would you like the AI to specifically focus on (Type N/A if not available):</label>
            <input style="width:550px !important;" id="focus" placeholder="i.e. The relationship between sin and cos as the sides of a right-angled triangle"><h4></h4>
            <button onclick="askGemini()" id="generate" style="background-color: rgb(164, 203, 237); padding: 15px; font-family: 'Elms Sans', monospace; border-radius: 15px;">Generate</button>
        </div>  

    </div>
        <br><br>
        <div class="glass-card">
            <p id="status" style="font-family: 'Elms Sans', monospace;">Your generating simulation will be presented here.</p>
            <div id="response"></div>
        </div>
        <br>
        <button id="downloadfile" style="background-color: rgb(164, 203, 237); padding: 15px; font-family: 'Elms Sans', monospace; border-radius: 15px;">Download the simulation</button>
        <br><br>
        <p id="watermark">dsochamp / Project 1 Aug 2026</p>
        <br>
        <script>
            let downloadbtn = document.getElementById("downloadfile");
            let generatedHTML = "";

            async function askGemini() {
                const status = document.getElementById("status");
                const responseBox = document.getElementById("response");
                const prompt = document.getElementById("prompt").value.trim();
                const source = document.getElementById("source").value.trim();
                const focuspoint = document.getElementById("focus").value.trim();

                responseBox.innerHTML = '';

                if (!prompt) {
                    status.textContent = "Please enter a concept.";
                    return;
                }

                const conceptPrompt = `Create a single self-contained HTML snippet that visualizes the concept "${prompt}".`;
                const sourcePrompt = source && source.toUpperCase() !== "N/A"
                    ? `Use this source for context: ${source}.`
                    : "";
                const focusPrompt = focuspoint && focuspoint.toUpperCase() !== "N/A"
                    ? `and specifically focus on explaining ${focuspoint}.`
                    : "";
                const finalPrompt = `${conceptPrompt}\n\n${sourcePrompt}\n\n${focusPrompt}\n\n. Return ONLY the HTML snippet, with no markdown fences and no explanation. Do not include <html>, <head>, <body>, or <title> tags. Use one root container such as a div, svg, or canvas. Make it work when inserted into an existing webpage and keep it complete and self-contained.`;

                status.textContent = "Generating...";
                responseBox.innerHTML = "";

                try {
                    const response = await fetch('/api/generate', {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            finalPrompt: finalPrompt 
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || data.error?.message || "Request failed.");
                    }

                    const rawReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
                    let cleanReply = rawReply
                        .replace(/^```(?:html)?\s*/i, "")
                        .replace(/```$/i, "")
                        .trim();

                    if (!cleanReply) {
                        throw new Error("The model returned an empty response.");
                    }

                    const iframe = document.createElement("iframe");
                    iframe.srcdoc = `<!doctype html>
                    <html>
                        <head>
                            <style>
                                body { margin: 0; padding: 16px; font-family: "Elms Sans", monospace; background: transparent; color: #49516F; box-sizing: border-box; }
                                * { box-sizing: border-box; }
                            </style>
                        </head>
                        <body>${cleanReply}</body>
                    </html>`;
                    generatedHTML = cleanReply;
                    iframe.setAttribute("sandbox", "allow-scripts");
                    iframe.style.width = "100%";
                    iframe.style.minHeight = "700px";
                    iframe.style.border = "0";
                    iframe.style.borderRadius = "16px";
                    iframe.style.background = "white";

                    responseBox.appendChild(iframe);
                    status.textContent = "Simulation ready.";
                    console.log(data);
                } catch (error) {
                    status.textContent = `Error: ${error.message}`;
                    console.error(error);
                }
            }

            downloadbtn.addEventListener("click", () => {
                const htmlCode = generatedHTML;
                const blob = new Blob([htmlCode], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "simulation.html";
                link.click();
                URL.revokeObjectURL(url);
            });
        </script>
    </body>
</html>
