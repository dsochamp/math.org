<!DOCTYPE html>

    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Walter+Turncoat&display=swap');

            body {
                font-family: "Walter Turncoat", cursive;
                background-color: #49516F;
                /* background-image: url('https://w0.peakpx.com/wallpaper/824/461/HD-wallpaper-blue-digits-background-math-concept-numbers-digits-texture-blue-backgrounds.jpg'); */
                display: grid;
                place-content: center;
            }

            h1 {
                text-align:center;
                color: white;
                font-size: 50px;
            }

            .container {
                place-content: center;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }

            .container-div{
                padding: 25px;
                text-align: center;
                border-radius: 15px;
                border-width: 10px;
            }

            img {
                object-fit: contain;
                width: 400px;
                border-radius: 15px;
                border: 5px solid whitesmoke;
                border-style: inset;
            }

            p {
                font-family: 'Merriweather Sans', sans-serif;
                text-align: center;
                color: whitesmoke;
            }
        </style>
    </head>

        <br>
